# Copy to <HERA_HOME>/hera.toml (default HERA_HOME is ~/.hera). Never commit the real file.

[budget]                       # first values; tune after the pilot
per_task_usd = 3.00
per_day_usd = 4.00
per_month_usd = 45.00
month_reserve_fraction = 0.10  # held back for disputes and escalations
strong_tier_max_share = 0.35

[prices]                       # USD per million tokens; dated so a stale table is visible
as_of = "2026-11-14"

[prices.tiers.cheap]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

[prices.tiers.default]
input = 2.00
output = 10.00
cache_read = 0.10
cache_write = 2.50

[prices.tiers.strong]
input = 8.00
output = 40.00
cache_read = 0.20
cache_write = 10.00

[prices.tiers.local]
input = 0.0
output = 0.0
cache_read = 0.0
cache_write = 0.0

[models]                       # fill in the exact dated model identifiers you use
cheap = ""
default = ""
strong = ""
local = "mlx-community/Qwen3.5-9B-OptiQ-4bit"

[local_model]
host_memory_limit_gb = 9.0
max_context_tokens = 12000
enable_thinking = false        # the model thinks by default; off for short local contexts

# ---- model providers ---------------------------------------------------------------------------
# One section per provider. The API key is NEVER written here: `key_env` is the NAME of an
# environment variable that holds it. A provider whose variable is unset (or whose model is empty)
# is left out; `hera providers list` shows why. Test one with `hera providers check <name>`.
[providers.default]
kind = "anthropic"            # anthropic | openai_compat | grok
url = "https://api.anthropic.com/v1/messages"
model = ""                    # exact dated model id
key_env = "ANTHROPIC_API_KEY" # name of the environment variable; the key itself is never in a file
tier = "default"              # must have a price under [prices.tiers]
extra_headers = { "anthropic-version" = "2023-06-01" }

# An OpenAI-compatible endpoint on this machine (llama-server and similar): loopback only, tier
# "local" (free, exempt from spending caps), no key.
# [providers.local-llm]
# kind = "openai_compat"
# url = "http://127.0.0.1:8080/v1/chat/completions"
# model = "your-local-model"
# local = true
# tier = "local"

# xAI Grok (OpenAI-compatible; url defaults to https://api.x.ai/v1/chat/completions).
# [providers.grok]
# kind = "grok"
# model = ""
# key_env = "XAI_API_KEY"
# tier = "cheap"
