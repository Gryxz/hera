[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hera"
version = "0.1.0.dev0"
description = "HERA coordinator: verified, budgeted, privacy-gated coding tasks on one machine (milestone 0.1)"
requires-python = ">=3.11"
dependencies = []            # core is standard library only (DA-1)

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hera = "hera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hera = ["store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
